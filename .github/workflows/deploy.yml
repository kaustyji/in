name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - name: Check build files
        run: |
          set -e

          test -f dist/index.html || {
            echo "ERROR: dist/index.html not found"
            exit 1
          }

          test -n "$(find dist/assets -maxdepth 1 -type f \( -name 'favicon-*' -o -name 'favicon.*' \) -print -quit)" || {
            echo "ERROR: Favicon asset not found in dist/assets"
            exit 1
          }

          test -f dist/assets/resume.pdf || {
            echo "ERROR: Resume not found at dist/assets/resume.pdf"
            exit 1
          }

          echo "Build checks passed successfully"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
